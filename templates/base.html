<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06080f">
    <title>{% block title %}{{ title_index }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="logo">AI 翻译</a>
            <div class="nav-links">
                {% if username %}
                <a href="/subtitle">{{ nav_subtitle }}</a>
                <a href="/article">{{ nav_article }}</a>
                <a href="/history">{{ nav_history }}</a>
                <a href="/settings">{{ nav_settings }}</a>
                <span class="nav-user">{{ username }}</span>
                <a href="/logout" class="btn-logout">{{ nav_logout }}</a>
                {% endif %}
                <select class="lang-select" onchange="if(this.value)location.href='/setlang/'+this.value" title="Language">
                    <option value="zh"{% if lang == 'zh' %} selected{% endif %}>简体</option>
                    <option value="zh-TW"{% if lang == 'zh-TW' %} selected{% endif %}>繁體</option>
                    <option value="zh-HK"{% if lang == 'zh-HK' %} selected{% endif %}>繁體(港)</option>
                    <option value="en"{% if lang == 'en' %} selected{% endif %}>EN</option>
                </select>
            </div>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
